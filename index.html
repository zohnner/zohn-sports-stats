    <!-- Anti-FOWT: set data-theme before first paint so CSS variables are correct immediately -->
    <script>
        (function(){
            var KEPT = { dark: 1, light: 1, 'nl-monarchs': 1 };  // D-047 — retired themes fall back to dark
            var theme = 'dark';
            try {
                var stored = localStorage.getItem('zs_theme');
                theme = (stored != null && KEPT[stored]) ? stored
                      : (stored != null ? 'dark'
                      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
            } catch (_) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
      /* Boot splash (D-048) — branded loading overlay. Inline + critical so it paints
         before the deferred script chain; app.js fades it out on first render. */
      #bootSplash{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:22px;background:#0d1014;transition:opacity .45s ease}
      html[data-theme="light"] #bootSplash{background:#f5f7fa}
      #bootSplash.boot-hide{opacity:0;pointer-events:none}
      #bootSplash .bm{display:flex;flex-direction:column;gap:7px;width:84px}
      #bootSplash .bm i{height:12px;border-radius:3px;background:#ff7a00;transform-origin:left center;
        animation:bootbar .9s ease-in-out infinite}
      #bootSplash .bm i:nth-child(2){width:64%;background:#ffb347;animation-delay:.12s}
      #bootSplash .bm i:nth-child(3){width:88%;animation-delay:.24s}
      @keyframes bootbar{0%,100%{transform:scaleX(.28);opacity:.4}50%{transform:scaleX(1);opacity:1}}
      #bootSplash .bw{font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;font-weight:700;
        letter-spacing:.02em;font-size:16px;color:#c5cbd3}
      html[data-theme="light"] #bootSplash .bw{color:#313944}
      #bootSplash .bw b{color:#ff7a00}
      @media (prefers-reduced-motion:reduce){#bootSplash .bm i{animation:none;transform:none;opacity:.9}}
    </style>
