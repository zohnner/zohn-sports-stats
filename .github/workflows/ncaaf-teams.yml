name: SportStrata NCAAF Teams Refresh

# Daily FBS team records for /ncaaf/team/:id while ESPN blocks Cloudflare
# (D-176). ESPN answers GitHub's runners, so tools/ncaaf-teams.cjs reads the
# standings here and commits content/ncaaf/teams.json, which the team template
# renders from when its own ESPN read fails. Same commit pattern and deploy key
# as nba-standings.yml; committed only when a record changes.

on:
  schedule:
    - cron: '15 11 * * *'   # 6:15 AM ET, after Saturday's late West Coast finals
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncaaf-teams
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SITEMAP_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build team snapshot
        run: node tools/ncaaf-teams.cjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- content/ncaaf/teams.json && git ls-files --error-unmatch content/ncaaf/teams.json >/dev/null 2>&1; then
            echo "teams unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ncaaf/teams.json
          git commit -m "chore: refresh NCAAF team snapshot [automated]"
          git push
