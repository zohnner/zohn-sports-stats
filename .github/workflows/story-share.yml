name: SportStrata Stories Share Links

# When a story merges, waits for it to go live, then posts a "Post to X" link
# (X's composer, prefilled with the approved ## X text from the .social.md) and
# copy-ready Reddit text as a comment on this week's "📣 Share queue" issue
# (D-200, tools/stories/share-queue.sh). Posting stays manual (D-179,
# replacing D-178's API auto-post): no X developer account, no secrets.
# workflow_dispatch with a slug regenerates the links for any story; story-automerge.yml
# dispatches it too (D-187), since its GITHUB_TOKEN merge doesn't fire the push trigger.

on:
  push:
    branches: [main]
    paths:
      - 'content/*/stories/*.md'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Story slug(s), space-separated, e.g. 2026-09-30-jaguars-fewest-points-allowed'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find new stories
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SLUG: ${{ inputs.slug }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/stories/share-links.cjs candidates --slug "$SLUG"
          else
            node tools/stories/share-links.cjs candidates "$BEFORE" "$AFTER"
          fi

      - name: Wait for live and build share links
        if: steps.find.outputs.targets != ''
        env:
          TARGETS: ${{ steps.find.outputs.targets }}
        run: node tools/stories/share-links.cjs comment share.md $TARGETS

      # D-200: one queue issue per week (Monday, UTC), each batch a comment on
      # it. The first batch of a new week closes last week's queue: a story
      # that old isn't worth posting.
      - name: Add to this week's share queue
        if: steps.find.outputs.targets != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s share.md ]; then
            echo "Nothing to share"
            exit 0
          fi
          cat share.md >> "$GITHUB_STEP_SUMMARY"
          bash tools/stories/share-queue.sh share.md
