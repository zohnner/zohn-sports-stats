name: SportStrata Social Digest

# Generates ready-to-post draft posts as a downloadable artifact.
# Does NOT post to X — no API keys/secrets required. You post manually.

on:
  schedule:
    # ~7 AM ET — digest of yesterday's finals. Off the top of the hour on
    # purpose: at '0 11' GitHub's scheduled-job queue started this 4-8.5h late
    # (15:04-19:31 UTC over 2026-09-30..10-05) — :00 is the busiest slot.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD), blank = yesterday'
        required: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # A healthy run takes ~30s. Without this, a hung step could hold the job
    # for GitHub's 6-hour default. (It would not have saved 2026-10-05: that
    # run was cancelled because no hosted runner ever picked it up.)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements-core.txt

      - name: Install dependencies
        # digest.py only needs the core deps -- not the NFL/visualizer stack
        # (numpy/pandas/matplotlib/nfl_data_py/nflreadpy/rich) in the full
        # requirements.txt. A bad pin in that stack broke this job for two
        # weeks even though digest.py never imports any of it.
        run: pip install -r bot/requirements-core.txt

      - name: Restore history DB
        uses: actions/cache@v4
        with:
          path: bot/bot.db
          key: mlb-bot-db-${{ github.run_id }}
          restore-keys: mlb-bot-db-

      - name: Generate digest
        working-directory: bot
        run: |
          python digest.py ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: Save history DB
        uses: actions/cache@v4
        with:
          path: bot/bot.db
          key: mlb-bot-db-${{ github.run_id }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: sportstrata-digest
          path: bot/drafts/*.md
          if-no-files-found: warn
