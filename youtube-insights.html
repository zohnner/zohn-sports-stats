<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>YouTube Insights — internal</title>
<!--
  Unlinked owner-only page — not in index.html, sw.js, sitemap.xml, or
  _routes.json (needs none of them: it's a plain static asset Cloudflare
  Pages serves directly, and it doesn't touch the SPA's AppState/script
  chain at all). Reached only via a private bookmarked URL of the form
  youtube-insights.html?key=YOUR_YOUTUBE_DASHBOARD_KEY — the key is read
  from the URL and sent as a header to /api/youtube, never stored.
  See functions/api/youtube.js and DECISIONS.md D-083/D-084.

  D-084: added performance-pattern analysis (view velocity, retention,
  subscriber efficiency, title-pattern tagging) — all computed client-side
  from the same payload the Function already returns, no backend change.
  Explicitly NOT a brand-voice/tone checker — owner confirmed the
  clickbait/reaction title style is intentional for this channel, separate
  from the site's "serious stats" brand, so this measures what performs
  rather than flagging what "should" change.

  D-085: added thumbnails (Top performers gallery + inline in the table)
  and a posting-day pattern panel, both from fields already present on the
  playlistItems response (thumbnailUrl, publishedAtIso) — no new API calls.
  Plus a CSV export. Deliberately left out: traffic-source breakdown and
  top-comment pulls, both of which need extra API calls per video — owner
  chose to hold off on the added quota/latency cost for now.
-->
<link rel="stylesheet" href="/css/variables.css">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg-base);
        color: var(--text-primary);
        font-family: var(--font-sans);
        padding: 32px 20px 80px;
    }
    .yti-wrap { max-width: 1200px; margin: 0 auto; }
    .yti-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 4px; }
    h1 { font-size: 1.4rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0 0 4px; }
    .yti-channel { color: var(--text-secondary); font-size: 0.9rem; }
    .yti-meta { color: var(--text-muted); font-size: 0.8rem; margin: 4px 0 24px; }
    .yti-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .yti-controls label { font-size: 0.8rem; color: var(--text-secondary); }
    .yti-controls input {
        background: var(--bg-surface); border: 1px solid var(--border-default); color: var(--text-primary);
        border-radius: var(--radius-md); padding: 6px 10px; width: 80px; font-family: var(--font-sans);
    }
    .yti-controls button {
        background: var(--accent); color: #14181d; border: none; border-radius: var(--radius-md);
        padding: 7px 16px; font-weight: 600; cursor: pointer; font-family: var(--font-sans);
    }
    .yti-controls button:disabled { opacity: 0.5; cursor: default; }
    .yti-controls button.yti-secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-default); }
    .yti-section { margin-bottom: 32px; }
    .yti-hint { color: var(--text-muted); font-size: 0.78rem; margin: 0 0 10px; max-width: 68ch; }
    table { width: 100%; border-collapse: collapse; background: var(--bg-surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-default); font-size: 0.85rem; }
    th { color: var(--text-secondary); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
    th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable:hover { color: var(--text-primary); }
    th.sorted { color: var(--accent); }
    td.num { font-family: var(--font-mono, monospace); font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .yti-status { color: var(--text-muted); font-size: 0.9rem; padding: 40px 0; text-align: center; }
    .yti-status.err { color: var(--color-loss, #ff5a5a); }
    .yti-scatter-wrap { background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 12px; }
    .yti-scatter-wrap svg { display: block; width: 100%; height: auto; }
    .yti-dot { fill: var(--accent); fill-opacity: 0.65; }
    .yti-dot.siren { fill: var(--color-loss, #ff5a5a); }
    .yti-axis-label { fill: var(--text-muted); font-size: 10px; font-family: var(--font-sans); }
    .yti-grid { stroke: var(--border-default); stroke-width: 1; }
    .yti-row-thumb { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; vertical-align: middle; margin-right: 8px; background: var(--bg-base); }
    .yti-title-cell { display: flex; align-items: center; }
    .yti-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .yti-card { background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; display: flex; flex-direction: column; }
    .yti-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--bg-base); }
    .yti-card-body { padding: 10px 12px; }
    .yti-card-title { font-size: 0.82rem; font-weight: 600; margin: 0 0 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .yti-card-stats { display: flex; gap: 10px; font-size: 0.72rem; color: var(--text-secondary); font-family: var(--font-mono, monospace); }
    .yti-card-rank { position: absolute; background: var(--accent); color: #14181d; font-weight: 700; font-size: 0.72rem; padding: 2px 8px; border-radius: 0 0 6px 0; }
    .yti-card-thumbwrap { position: relative; }
</style>
</head>
<body>
<div class="yti-wrap">
    <div class="yti-head">
        <h1>YouTube Insights</h1>
        <span class="yti-channel" id="ytiChannel"></span>
    </div>
    <div class="yti-meta" id="ytiMeta"></div>
    <div class="yti-controls">
        <label for="ytiDays">Days</label>
        <input type="number" id="ytiDays" value="90" min="1" max="365">
        <label for="ytiLimit">Videos</label>
        <input type="number" id="ytiLimit" value="100" min="1" max="200">
        <button id="ytiReload">Reload</button>
        <button id="ytiExport" class="yti-secondary" type="button">Export CSV</button>
    </div>
    <div id="ytiBody"><div class="yti-status">Loading…</div></div>
</div>
<script>
(function () {
    const params = new URLSearchParams(location.search);
    const key = params.get('key') || '';
    const daysInput = document.getElementById('ytiDays');
    const limitInput = document.getElementById('ytiLimit');
    const reloadBtn = document.getElementById('ytiReload');
    const bodyEl = document.getElementById('ytiBody');
    const channelEl = document.getElementById('ytiChannel');
    const metaEl = document.getElementById('ytiMeta');

    if (!key) {
        bodyEl.innerHTML = '<div class="yti-status err">No key in URL. Open this page as youtube-insights.html?key=YOUR_YOUTUBE_DASHBOARD_KEY.</div>';
        reloadBtn.disabled = true;
        return;
    }

    // NFL team name -> abbreviation, for lightweight title tagging. Matched as
    // whole words, case-insensitive, first match wins. Not exhaustive of every
    // possible nickname — good enough for a "what are we covering" signal.
    const NFL_TEAMS = [
        ['Cardinals','ARI'],['Falcons','ATL'],['Ravens','BAL'],['Bills','BUF'],
        ['Panthers','CAR'],['Bears','CHI'],['Bengals','CIN'],['Browns','CLE'],
        ['Cowboys','DAL'],['Broncos','DEN'],['Lions','DET'],['Packers','GB'],
        ['Texans','HOU'],['Colts','IND'],['Jaguars','JAX'],['Chiefs','KC'],
        ['Raiders','LV'],['Chargers','LAC'],['Rams','LAR'],['Dolphins','MIA'],
        ['Vikings','MIN'],['Patriots','NE'],['Saints','NO'],['Giants','NYG'],
        ['Jets','NYJ'],['Eagles','PHI'],['Steelers','PIT'],['49ers','SF'],
        ['Niners','SF'],['Seahawks','SEA'],['Buccaneers','TB'],['Bucs','TB'],
        ['Titans','TEN'],['Commanders','WAS'],
    ];

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function fmtDuration(sec) {
        if (sec == null) return '—';
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
    }

    function fmtPct(p) { return p == null ? '—' : `${Math.round(p)}%`; }
    function fmtNum(n) { return n == null ? '—' : Number(n).toLocaleString(); }
    function fmtSigned(n) { return n == null ? '—' : (n > 0 ? `+${n}` : String(n)); }
    function fmt1(n) { return n == null ? '—' : n.toFixed(1); }

    function computeTags(title) {
        const hasSiren = title.includes('🚨');
        const isBreaking = /\bBREAKING\b/i.test(title);
        let hasEmoji = false;
        try { hasEmoji = /\p{Extended_Pictographic}/u.test(title); } catch (e) { hasEmoji = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(title); }
        const words = title.match(/[A-Za-z']{3,}/g) || [];
        const capsWords = words.filter(w => w === w.toUpperCase());
        const allCapsHeavy = capsWords.length >= 3;
        let team = null;
        for (const [name, abbr] of NFL_TEAMS) {
            if (new RegExp('\\b' + name + '\\b', 'i').test(title)) { team = abbr; break; }
        }
        return { hasSiren, isBreaking, hasEmoji, allCapsHeavy, team };
    }

    // Enrich each video with derived, decision-useful metrics — none of this
    // requires another API call, it's all computed from the payload already
    // returned by /api/youtube.
    const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    function enrich(v, days) {
        const published = new Date(v.publishedAt + 'T00:00:00Z');
        const daysSince = Math.max(1, Math.floor((Date.now() - published.getTime()) / 86400000));
        // windowedViews only covers the queried date range, so a video older
        // than that range shouldn't have its full lifetime age used as the
        // divisor — cap at `days`. A video newer than the range uses its
        // actual (shorter) age.
        const effectiveDays = Math.min(daysSince, days);
        const velocity = v.windowedViews != null ? v.windowedViews / effectiveDays : null;
        const subsPer1k = (v.subscribersNet != null && v.windowedViews) ? (v.subscribersNet / v.windowedViews) * 1000 : null;
        // publishedAtIso carries the real publish time (UTC) — used only for
        // posting-time patterns, not the daysSince math above, which stays on
        // the date-only value for stability.
        let dayOfWeek = null, hourOfDay = null;
        if (v.publishedAtIso) {
            const dt = new Date(v.publishedAtIso);
            if (!isNaN(dt.getTime())) { dayOfWeek = dt.getUTCDay(); hourOfDay = dt.getUTCHours(); }
        }
        return Object.assign({}, v, { daysSince, effectiveDays, velocity, subsPer1k, dayOfWeek, hourOfDay, tags: computeTags(v.title) });
    }

    function aggregateByTag(videos) {
        const groups = {};
        function add(key, v) {
            if (!groups[key]) groups[key] = { key, count: 0, velocitySum: 0, velocityN: 0, retSum: 0, retN: 0, subsSum: 0, subsN: 0 };
            const g = groups[key];
            g.count++;
            if (v.velocity != null) { g.velocitySum += v.velocity; g.velocityN++; }
            if (v.avgViewPercentage != null) { g.retSum += v.avgViewPercentage; g.retN++; }
            if (v.subsPer1k != null) { g.subsSum += v.subsPer1k; g.subsN++; }
        }
        videos.forEach(v => {
            add(v.tags.hasSiren ? '🚨 has siren emoji' : 'no siren emoji', v);
            add(v.tags.isBreaking ? '"BREAKING"' : 'not "BREAKING"', v);
            add(v.tags.allCapsHeavy ? 'caps-heavy title' : 'normal-case title', v);
            if (v.tags.team) add('Team: ' + v.tags.team, v);
        });
        return Object.values(groups)
            .filter(g => g.count >= 2)
            .map(g => ({
                key: g.key, count: g.count,
                avgVelocity: g.velocityN ? g.velocitySum / g.velocityN : null,
                avgRetention: g.retN ? g.retSum / g.retN : null,
                avgSubsPer1k: g.subsN ? g.subsSum / g.subsN : null,
            }))
            .sort((a, b) => (b.avgVelocity ?? -1) - (a.avgVelocity ?? -1));
    }

    // Posting-day pattern — UTC day-of-week, since that's what publishedAtIso
    // gives us without guessing the owner's local timezone. Fine for a
    // "which day tends to work" signal; not meant to be minute-precise.
    function aggregateByDay(videos) {
        const groups = {};
        videos.forEach(v => {
            if (v.dayOfWeek == null) return;
            const key = DAY_NAMES[v.dayOfWeek];
            if (!groups[key]) groups[key] = { key, count: 0, velocitySum: 0, velocityN: 0, retSum: 0, retN: 0 };
            const g = groups[key];
            g.count++;
            if (v.velocity != null) { g.velocitySum += v.velocity; g.velocityN++; }
            if (v.avgViewPercentage != null) { g.retSum += v.avgViewPercentage; g.retN++; }
        });
        // Keep natural Sun-Sat order rather than sorting by performance —
        // this is a calendar view, easier to scan in order.
        return DAY_NAMES.map(d => groups[d]).filter(Boolean).map(g => ({
            key: g.key, count: g.count,
            avgVelocity: g.velocityN ? g.velocitySum / g.velocityN : null,
            avgRetention: g.retN ? g.retSum / g.retN : null,
        }));
    }

    const COLUMNS = [
        { key: 'title', label: 'Video', sortable: false },
        { key: 'publishedAt', label: 'Published', sortable: true },
        { key: 'durationSeconds', label: 'Duration', sortable: true },
        { key: 'velocity', label: 'Views/day', sortable: true },
        { key: 'windowedViews', label: 'Views (window)', sortable: true },
        { key: 'avgViewPercentage', label: 'Avg view %', sortable: true },
        { key: 'subsPer1k', label: 'Subs/1k views', sortable: true },
        { key: 'lifetimeViews', label: 'Lifetime views', sortable: true },
        { key: 'lifetimeLikes', label: 'Likes', sortable: true },
    ];

    let sortState = { key: 'velocity', dir: 'desc' };
    let currentVideos = [];

    function sortVideos(videos) {
        const { key, dir } = sortState;
        const mul = dir === 'desc' ? -1 : 1;
        return videos.slice().sort((a, b) => {
            const av = a[key], bv = b[key];
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            if (av < bv) return -1 * mul;
            if (av > bv) return 1 * mul;
            return 0;
        });
    }

    function renderScatter(videos) {
        const pts = videos.filter(v => v.velocity != null && v.avgViewPercentage != null);
        if (pts.length < 3) return '';
        const W = 760, H = 300, padL = 44, padR = 16, padT = 12, padB = 30;
        const maxV = Math.max(...pts.map(p => p.velocity));
        const maxLogV = Math.log10(maxV + 1);
        const maxRet = Math.min(200, Math.max(100, Math.ceil(Math.max(...pts.map(p => p.avgViewPercentage)) / 10) * 10));
        const x = v => padL + (Math.log10(v + 1) / (maxLogV || 1)) * (W - padL - padR);
        const y = r => H - padB - (Math.min(r, maxRet) / maxRet) * (H - padT - padB);

        const gridLines = [0.25, 0.5, 0.75, 1].map(f => {
            const yy = padT + f * (H - padT - padB);
            const label = Math.round(maxRet * (1 - f));
            return `<line class="yti-grid" x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}"/><text class="yti-axis-label" x="4" y="${yy + 3}">${label}%</text>`;
        }).join('');

        const dots = pts.map(p => {
            const cls = p.tags.hasSiren ? 'yti-dot siren' : 'yti-dot';
            const title = `${p.title} — ${Math.round(p.velocity)} views/day, ${Math.round(p.avgViewPercentage)}% retention`;
            return `<circle class="${cls}" cx="${x(p.velocity).toFixed(1)}" cy="${y(p.avgViewPercentage).toFixed(1)}" r="4"><title>${esc(title)}</title></circle>`;
        }).join('');

        return `
            <div class="yti-scatter-wrap">
                <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
                    ${gridLines}
                    <text class="yti-axis-label" x="${padL}" y="${H - 6}">low views/day</text>
                    <text class="yti-axis-label" x="${W - padR - 90}" y="${H - 6}">high views/day (log scale)</text>
                    ${dots}
                </svg>
            </div>`;
    }

    function renderPatterns(videos) {
        const groups = aggregateByTag(videos);
        if (!groups.length) return '';
        const rows = groups.map(g => `
            <tr>
                <td>${esc(g.key)}</td>
                <td class="num">${g.count}</td>
                <td class="num">${g.avgVelocity != null ? fmt1(g.avgVelocity) : '—'}</td>
                <td class="num">${g.avgRetention != null ? fmtPct(g.avgRetention) : '—'}</td>
                <td class="num">${g.avgSubsPer1k != null ? fmt1(g.avgSubsPer1k) : '—'}</td>
            </tr>`).join('');
        return `
            <table>
                <thead><tr>
                    <th>Title pattern</th><th>Videos</th><th>Avg views/day</th><th>Avg retention</th><th>Avg subs/1k views</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    function renderTimePatterns(videos) {
        const days = aggregateByDay(videos);
        if (days.length < 3) return '';
        const rows = days.map(d => `
            <tr>
                <td>${esc(d.key)}</td>
                <td class="num">${d.count}</td>
                <td class="num">${d.avgVelocity != null ? fmt1(d.avgVelocity) : '—'}</td>
                <td class="num">${d.avgRetention != null ? fmtPct(d.avgRetention) : '—'}</td>
            </tr>`).join('');
        return `
            <table>
                <thead><tr><th>Publish day (UTC)</th><th>Videos</th><th>Avg views/day</th><th>Avg retention</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    function renderGallery(videos, n) {
        const top = videos
            .filter(v => v.velocity != null && v.thumbnailUrl)
            .slice()
            .sort((a, b) => b.velocity - a.velocity)
            .slice(0, n);
        if (!top.length) return '';
        const cards = top.map((v, i) => `
            <div class="yti-card">
                <div class="yti-card-thumbwrap">
                    <span class="yti-card-rank">#${i + 1}</span>
                    <a href="${esc(v.url)}" target="_blank" rel="noopener"><img src="${esc(v.thumbnailUrl)}" alt="" loading="lazy"></a>
                </div>
                <div class="yti-card-body">
                    <p class="yti-card-title"><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></p>
                    <div class="yti-card-stats">
                        <span>${fmt1(v.velocity)}/day</span>
                        <span>${fmtPct(v.avgViewPercentage)} ret.</span>
                    </div>
                </div>
            </div>`).join('');
        return `<div class="yti-gallery">${cards}</div>`;
    }

    function renderTable(videos) {
        const sorted = sortVideos(videos);
        const headerCells = COLUMNS.map(c => {
            if (!c.sortable) return `<th>${c.label}</th>`;
            const isSorted = sortState.key === c.key;
            const arrow = isSorted ? (sortState.dir === 'desc' ? ' ↓' : ' ↑') : '';
            return `<th class="sortable${isSorted ? ' sorted' : ''}" data-key="${c.key}">${c.label}${arrow}</th>`;
        }).join('');
        const rows = sorted.map(v => `
            <tr>
                <td><div class="yti-title-cell">${v.thumbnailUrl ? `<img class="yti-row-thumb" src="${esc(v.thumbnailUrl)}" alt="" loading="lazy">` : ''}<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></div></td>
                <td class="num">${esc(v.publishedAt)}</td>
                <td class="num">${fmtDuration(v.durationSeconds)}</td>
                <td class="num">${v.velocity != null ? fmt1(v.velocity) : '—'}</td>
                <td class="num">${fmtNum(v.windowedViews)}</td>
                <td class="num">${fmtPct(v.avgViewPercentage)}</td>
                <td class="num">${v.subsPer1k != null ? fmt1(v.subsPer1k) : '—'}</td>
                <td class="num">${fmtNum(v.lifetimeViews)}</td>
                <td class="num">${fmtNum(v.lifetimeLikes)}</td>
            </tr>`).join('');
        return `
            <table id="ytiTable">
                <thead><tr>${headerCells}</tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    function renderAll() {
        bodyEl.querySelector('#ytiTableSection').innerHTML = renderTable(currentVideos);
        bodyEl.querySelectorAll('#ytiTable th.sortable').forEach(th => {
            th.addEventListener('click', () => {
                const k = th.dataset.key;
                if (sortState.key === k) sortState.dir = sortState.dir === 'desc' ? 'asc' : 'desc';
                else sortState = { key: k, dir: 'desc' };
                renderAll();
            });
        });
    }

    async function load() {
        reloadBtn.disabled = true;
        bodyEl.innerHTML = '<div class="yti-status">Loading…</div>';
        const days = Number(daysInput.value) || 90;
        try {
            const res = await fetch(`/api/youtube?days=${encodeURIComponent(days)}&limit=${encodeURIComponent(limitInput.value || 100)}`, {
                headers: { 'X-YouTube-Dashboard-Key': key },
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            render(data, days);
        } catch (err) {
            bodyEl.innerHTML = `<div class="yti-status err">${esc(err.message || String(err))}</div>`;
        } finally {
            reloadBtn.disabled = false;
        }
    }

    function render(data, days) {
        const handle = data.channel.customUrl ? ` (${esc(data.channel.customUrl)})` : '';
        channelEl.textContent = `${data.channel.title}${handle}`;
        metaEl.textContent = `${data.range.start} to ${data.range.end} · generated ${new Date(data.generatedAt).toLocaleString()}`;

        if (!data.videos.length) {
            bodyEl.innerHTML = '<div class="yti-status">No videos found.</div>';
            return;
        }

        currentVideos = data.videos.map(v => enrich(v, days));
        const galleryHtml = renderGallery(currentVideos, 8);
        const scatterHtml = renderScatter(currentVideos);
        const patternsHtml = renderPatterns(currentVideos);
        const timeHtml = renderTimePatterns(currentVideos);

        bodyEl.innerHTML = `
            ${galleryHtml ? `
            <div class="yti-section">
                <h2>Top performers</h2>
                <p class="yti-hint">Highest views/day among videos with a usable thumbnail. Look at these as a set — thumbnail style, framing, and subject are easier to spot as patterns visually than from a table of titles.</p>
                ${galleryHtml}
            </div>` : ''}
            ${scatterHtml ? `
            <div class="yti-section">
                <h2>Reach vs. retention</h2>
                <p class="yti-hint">Each dot is a video. Right = getting seen (views/day since publish, log scale). Up = holding attention once clicked (average view %). Bottom-right = hyped but not retaining; top-left = genuinely engaging but under-promoted; top-right is what to make more of. Red dots use the 🚨 emoji.</p>
                ${scatterHtml}
            </div>` : ''}
            ${patternsHtml ? `
            <div class="yti-section">
                <h2>What's working</h2>
                <p class="yti-hint">Average performance grouped by title pattern and team covered — only groups with 2+ videos shown. This is what to make more (or less) of, not a style guide.</p>
                ${patternsHtml}
            </div>` : ''}
            ${timeHtml ? `
            <div class="yti-section">
                <h2>Posting day</h2>
                <p class="yti-hint">Average performance by day of week (UTC) the video was published. Read as a rough signal, not a hard rule — sample sizes per day are small.</p>
                ${timeHtml}
            </div>` : ''}
            <div class="yti-section">
                <h2>All videos</h2>
                <p class="yti-hint">Click a column header to sort. "Views/day" and "Subs/1k views" are the two figures that best separate a video that grew the channel from one that just spiked.</p>
                <div id="ytiTableSection"></div>
            </div>`;
        renderAll();
    }

    function exportCsv() {
        if (!currentVideos.length) return;
        const cols = [
            ['title', v => v.title], ['url', v => v.url], ['publishedAt', v => v.publishedAt],
            ['durationSeconds', v => v.durationSeconds], ['viewsPerDay', v => v.velocity != null ? v.velocity.toFixed(2) : ''],
            ['windowedViews', v => v.windowedViews], ['avgViewPercentage', v => v.avgViewPercentage],
            ['subsPer1kViews', v => v.subsPer1k != null ? v.subsPer1k.toFixed(3) : ''],
            ['lifetimeViews', v => v.lifetimeViews], ['lifetimeLikes', v => v.lifetimeLikes],
        ];
        const csvEsc = s => {
            const str = String(s ?? '');
            return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
        };
        const lines = [cols.map(c => c[0]).join(',')];
        sortVideos(currentVideos).forEach(v => lines.push(cols.map(c => csvEsc(c[1](v))).join(',')));
        const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `youtube-insights-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
    }

    const exportBtn = document.getElementById('ytiExport');
    reloadBtn.addEventListener('click', load);
    exportBtn.addEventListener('click', exportCsv);
    load();
})();
</script>
</body>
</html>
